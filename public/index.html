<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>ValWars - 3D Top-Down Multiplayer</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/hud.css">
</head>
<body>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Orientation Overlay -->
  <div id="orientation-overlay" class="hidden">
    <svg class="rotate-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
      <path d="M12 18h.01"></path>
    </svg>
    <h2 id="orientation-text">Putar Perangkat Ke Landscape</h2>
    <p style="font-size: 13px; color: #94a3b8; margin-top: 8px;">Game ini membutuhkan tampilan mendatar untuk kontrol joystick.</p>
  </div>

  <!-- Menu View (Portrait) -->
  <div id="menu-container">
    <!-- Auth Screen -->
    <div id="auth-screen" class="auth-card">
      <div class="auth-header">ValWars</div>
      <div class="auth-tabs">
        <div id="tab-login" class="auth-tab active">Login</div>
        <div id="tab-register" class="auth-tab">Register</div>
      </div>
      <form id="auth-form" onsubmit="return false;">
        <input type="text" id="auth-username" class="input-field" placeholder="Username (3-16 karakter)" autocomplete="username" required>
        <input type="password" id="auth-password" class="input-field" placeholder="Password (min 8 karakter)" autocomplete="current-password" required>
        <button type="submit" id="auth-submit-btn" class="btn" style="width: 100%; margin-top: 8px;">Masuk</button>
      </form>
    </div>

    <!-- Main Lobby & Room Screen -->
    <div id="lobby-screen" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
      <!-- User Header -->
      <div class="menu-header">
        <div class="user-info">
          <div id="user-avatar" class="user-avatar">U</div>
          <div>
            <div id="user-name" style="font-weight: 700;">Player</div>
            <div style="font-size: 11px; color: var(--text-muted);">Online</div>
          </div>
        </div>
        <button id="logout-btn" class="btn btn-secondary" style="padding: 6px 12px; font-size: 13px;">Keluar</button>
      </div>

      <!-- Room Browser View -->
      <div id="room-browser" style="display: flex; flex-direction: column; flex: 1;">
        <div class="section-title">
          <span>Daftar Room Publik</span>
          <button id="refresh-rooms-btn" class="btn btn-secondary" style="padding: 4px 8px; font-size: 12px;">Segarkan</button>
        </div>

        <div class="room-list-container scrollable">
          <div id="room-list" class="room-list">
            <div style="text-align: center; color: var(--text-muted); margin-top: 20px;">Belum ada room aktif</div>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px; margin-top: auto;">
          <div class="join-inputs">
            <input type="number" id="join-code-input" class="input-field" placeholder="Kode Room (4 Digit)" style="margin-bottom: 0;">
            <button id="join-room-btn" class="btn btn-secondary" style="white-space: nowrap;">Join Code</button>
          </div>
          <button id="create-room-btn" class="btn" style="width: 100%;">Buat Room Baru</button>
        </div>
      </div>

      <!-- Room Waiting Lobby View -->
      <div id="room-lobby" class="lobby-card hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div>
            <div style="font-size: 12px; color: var(--text-muted);">KODE ROOM</div>
            <div id="lobby-code-display" class="room-code" style="font-size: 24px; color: var(--accent-color);">----</div>
          </div>
          <button id="leave-room-btn" class="btn btn-danger" style="padding: 6px 12px; font-size: 12px;">Keluar</button>
        </div>

        <div id="host-settings" class="hidden" style="display: flex; gap: 8px; margin-top: 8px;">
          <div class="select-group" style="flex: 1;">
            <label>Mode</label>
            <select id="select-mode" class="input-field">
              <option value="1v1">1 vs 1</option>
              <option value="2v2">2 vs 2</option>
              <option value="3v3">3 vs 3</option>
              <option value="4v4">4 vs 4</option>
              <option value="FFA">Free For All</option>
            </select>
          </div>
          <div class="select-group" style="flex: 1;">
            <label>Map</label>
            <select id="select-map" class="input-field">
              <option value="arena">Arena Simple</option>
              <option value="kota">Kota Perkotaan</option>
              <option value="gurun">Gurun Pasir</option>
            </select>
          </div>
        </div>

        <div style="margin-top: 8px; font-weight: 700; font-size: 14px;">Pemain (<span id="player-count">0</span>):</div>
        <div id="lobby-players-list" class="lobby-players-list scrollable"></div>

        <div style="display: flex; gap: 8px; margin-top: auto;">
          <button id="ready-toggle-btn" class="btn btn-secondary" style="flex: 1;">SIAP</button>
          <button id="start-game-btn" class="btn btn-success hidden" style="flex: 1;">MULAI</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Game View (Landscape) -->
  <div id="game-container" class="hidden">
    <canvas id="game-canvas"></canvas>

    <!-- HUD Overlay -->
    <div id="hud-overlay">
      <div class="hud-top">
        <div class="hud-score">
          <span class="score-red" id="score-red-text">RED: 0</span>
          <span>-</span>
          <span class="score-blue" id="score-blue-text">BLUE: 0</span>
        </div>
        <div class="hud-timer" id="hud-timer-text">03:00</div>
        <div class="kill-feed" id="kill-feed"></div>
      </div>

      <div class="hud-player-status">
        <div class="hp-bar-container">
          <div id="hp-bar-fill" class="hp-bar-fill"></div>
        </div>
        <div class="ammo-text" id="ammo-text">30 / 30</div>
      </div>

      <div class="hud-bottom">
        <div id="joystick-zone" class="joystick-zone">
          <div id="joystick-thumb" class="joystick-thumb"></div>
        </div>

        <div class="action-buttons">
          <div id="btn-reload" class="action-btn">
            <span>RELOAD</span>
          </div>
          <div id="btn-grenade" class="action-btn">
            <span>GRND</span>
          </div>
          <div id="btn-fire" class="action-btn action-btn-fire">
            <span>FIRE</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
